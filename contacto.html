<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📞 Contacto - Centro Infantil Mundo Mágico</title>
    <meta name="description" content="Escríbenos a Mundo Mágico: horario, teléfono, email y formulario de contacto.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧸</text></svg>">
    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-contenido">
            <div class="logo">
                <h1>🧸 Mundo Mágico</h1>
                <p>Centro Infantil para mentes brillantes +13</p>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">🏠 Inicio</a></li>
                    <li><a href="nosotros.html">👥 Nosotros</a></li>
                    <li><a href="juego.html">🎮 Juegos</a></li>
                    <li><a href="ubicacion.html">📍 Ubicación</a></li>
                    <li><a href="contacto.html" class="activo">📞 Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="seccion">
        <h2>📞 Contáctanos</h2>
        <p style="text-align:center; color:#666; margin-bottom:30px; font-size:1.1em;">
            ¿Tienes alguna pregunta? ¡Escríbenos y te responderemos pronto!
        </p>

        <form class="formulario" onsubmit="event.preventDefault(); alert('¡Gracias por tu mensaje! Te contactaremos pronto.');">
            <label for="nombre">👤 Nombre completo</label>
            <input type="text" id="nombre" placeholder="Tu nombre" required>

            <label for="email">✉️ Correo electrónico</label>
            <input type="email" id="email" placeholder="tucorreo@ejemplo.com" required>

            <label for="asunto">📌 Asunto</label>
            <input type="text" id="asunto" placeholder="¿Sobre qué nos escribes?" required>

            <label for="mensaje">💬 Mensaje</label>
            <textarea id="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>

            <button type="submit" class="btn-principal">📨 Enviar Mensaje</button>
        </form>
    </section>

    <footer>
        <p>© 2026 Centro Infantil Mundo Mágico - Proyecto de Servidores Web</p>
        <div class="redes">📘 📷 🐦 ▶️</div>
    </footer>
</body>
</html>
